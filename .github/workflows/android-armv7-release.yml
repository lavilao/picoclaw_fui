name: Build Android ARMv7

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout picoclaw_fui
        uses: actions/checkout@v4

      # ── Toolchains ──────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ── NDK (pre-installed on the runner) ───────────
      - name: Configure NDK paths
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK_HOME=$NDK"            >> $GITHUB_ENV
          echo "NDK_TOOLCHAIN=$TOOLCHAIN"  >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK"     >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang++" >> $GITHUB_ENV
          echo "NDK: $NDK"

      # ── Clone picoclaw (Go) ─────────────────────────
      - name: Clone picoclaw
        run: git clone --depth 1 https://github.com/sipeed/picoclaw /tmp/picoclaw

      # ── 1) Gateway binary  (./cmd/picoclaw) ─────────
      - name: Build picoclaw gateway (Go → android/armv7)
        working-directory: /tmp/picoclaw
        run: |
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 \
            go build \
              -tags stdjson,whatsapp_native \
              -ldflags "-s -w" \
              -o /tmp/picoclaw-armv7-android \
              ./cmd/picoclaw

          ls -lh /tmp/picoclaw-armv7-android

      # ── 2) Web launcher binary  (./web/backend/) ────
      - name: Build picoclaw-web frontend assets
        working-directory: /tmp/picoclaw/web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:backend

      - name: Build picoclaw-web launcher (Go → android/armv7)
        working-directory: /tmp/picoclaw/web
        run: |
          # systray stub — android/arm forces CGO_ENABLED=1,
          # but upstream only has a !cgo stub
          cat > backend/systray_android.go <<'GOEOF'
          //go:build android

          package main

          import (
          	"context"
          	"os"
          	"os/signal"
          	"syscall"
          	"time"

          	"github.com/sipeed/picoclaw/pkg/logger"
          )

          func runTray() {
          	logger.Infof("System tray is unavailable on Android; running headless")
          	if !*noBrowser {
          		go func() {
          			time.Sleep(browserDelay)
          			if err := openBrowser(); err != nil {
          				logger.Errorf("Warning: Failed to auto-open browser: %v", err)
          			}
          		}()
          	}
          	ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)
          	defer stop()
          	<-ctx.Done()
          	shutdownApp()
          }
          GOEOF

          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 \
            go build \
              -tags stdjson \
              -ldflags "-s -w" \
              -o /tmp/picoclaw-web-armv7-android \
              ./backend/

          ls -lh /tmp/picoclaw-web-armv7-android

      # ── 3) Place both binaries into jniLibs ─────────
      - name: Install JNI libraries
        run: |
          DEST=android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p "$DEST"

          cp /tmp/picoclaw-armv7-android     "$DEST/libpicoclaw.so"
          cp /tmp/picoclaw-web-armv7-android "$DEST/libpicoclaw-web.so"

          echo "--- jniLibs/armeabi-v7a ---"
          ls -lh "$DEST/"

      # ── 4) Build Flutter APK ────────────────────────
      - name: Write local.properties
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$NDK_HOME
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (armeabi-v7a)
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk picoclaw_fui-armv7.apk
          ls -lh picoclaw_fui-armv7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw_fui-armv7
          path: picoclaw_fui-armv7.apk
