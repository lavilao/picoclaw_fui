name: Build Android ARMv7 Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ANDROID_NDK_HOME: /opt/android-ndk-r29

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add armv7-linux-androideabi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android SDK Command-line Tools & Build Tools
        run: |
          mkdir -p $HOME/android-sdk
          wget -q -O /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv /tmp/cmdline-tools-extract/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install and Set Up Android NDK r29
        run: |
          wget -q -O /tmp/android-ndk.zip "https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          sudo unzip -q /tmp/android-ndk.zip -d /opt
          # Rename to a predictable path
          NDK_DIR=$(find /opt -maxdepth 1 -type d -name "android-ndk-r2*")
          if [ "$NDK_DIR" != "/opt/android-ndk-r29" ]; then
            sudo mv "$NDK_DIR" /opt/android-ndk-r29
          fi
          rm -f /tmp/android-ndk.zip

          # Symlink libclang_rt.builtins-arm-android.a -> libgcc.a (needed by Rust linker)
          BUILTIN_A=$(find /opt/android-ndk-r29 -name "libclang_rt.builtins-arm-android.a" | head -n 1)
          if [ -n "$BUILTIN_A" ]; then
            BUILTIN_DIR=$(dirname "$BUILTIN_A")
            sudo ln -sf "$BUILTIN_A" "$BUILTIN_DIR/libgcc.a"
            echo "Symlinked: $BUILTIN_A -> $BUILTIN_DIR/libgcc.a"
          else
            echo "Error: libclang_rt.builtins-arm-android.a not found!"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=/opt/android-ndk-r29" >> $GITHUB_ENV

      - name: Write local.properties (SDK + NDK paths for Gradle)
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=$HOME/android-sdk
          ndk.dir=/opt/android-ndk-r29
          EOF

      # ──────────────────────────────────────────────
      # Build zeroclaw (Rust native core)
      # ──────────────────────────────────────────────
      - name: Build zeroclaw (Rust → armv7-linux-androideabi)
        run: |
          git clone --depth 1 https://github.com/rerod/zeroclaw /tmp/zeroclaw
          cd /tmp/zeroclaw

          NDK=/opt/android-ndk-r29
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC_armv7_linux_androideabi=armv7a-linux-androideabi24-clang
          export CXX_armv7_linux_androideabi=armv7a-linux-androideabi24-clang++
          export CC=armv7a-linux-androideabi24-clang
          export CXX=armv7a-linux-androideabi24-clang++
          export TMPDIR=/tmp

          cargo build --release --target armv7-linux-androideabi \
            --config 'target.armv7-linux-androideabi.linker="/opt/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"' \
            --config 'profile.release.lto="thin"' \
            --config 'profile.release.codegen-units=16'

          # cdylib output is libzeroclaw.so; copy with the name the app expects
          mkdir -p /tmp/browser
          cp target/armv7-linux-androideabi/release/libzeroclaw.so /tmp/browser/libpicoclaw.so
          echo "zeroclaw built successfully"
          ls -lh /tmp/browser/libpicoclaw.so

      # ──────────────────────────────────────────────
      # Build picoclaw-web (Go launcher binary)
      # ──────────────────────────────────────────────
      - name: Clone picoclaw repository
        run: |
          git clone --depth 1 https://github.com/sipeed/picoclaw /tmp/picoclaw

      - name: Build picoclaw-web frontend assets
        working-directory: /tmp/picoclaw/web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:backend

      - name: Build picoclaw-web (Go → android/armv7)
        working-directory: /tmp/picoclaw/web
        run: |
          # Patch: add systray stub for android+cgo
          cat > backend/systray_android.go <<'GOEOF'
          //go:build android

          package main

          import (
            "context"
            "os"
            "os/signal"
            "syscall"
            "time"

            "github.com/sipeed/picoclaw/pkg/logger"
          )

          func runTray() {
            logger.Infof("System tray is unavailable on Android; running headless")

            if !*noBrowser {
              go func() {
                time.Sleep(browserDelay)
                if err := openBrowser(); err != nil {
                  logger.Errorf("Warning: Failed to auto-open browser: %v", err)
                }
              }()
            }

            ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)
            defer stop()

            <-ctx.Done()

            shutdownApp()
          }
          GOEOF

          NDK=/opt/android-ndk-r29
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC=armv7a-linux-androideabi24-clang
          export CXX=armv7a-linux-androideabi24-clang++
          export TMPDIR=/tmp

          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 \
            go build -tags stdjson -ldflags "-s -w" \
              -o /tmp/browser/libpicoclaw-web.so ./backend/

          echo "picoclaw-web built successfully"
          ls -lh /tmp/browser/libpicoclaw-web.so

      # ──────────────────────────────────────────────
      # Assemble & build Flutter APK
      # ──────────────────────────────────────────────
      - name: Prepare Android JNI Directories & Assets
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp /tmp/browser/libpicoclaw.so     android/app/src/main/jniLibs/armeabi-v7a/libpicoclaw.so
          cp /tmp/browser/libpicoclaw-web.so android/app/src/main/jniLibs/armeabi-v7a/libpicoclaw-web.so
          echo "JNI libs in place:"
          ls -lh android/app/src/main/jniLibs/armeabi-v7a/

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Flutter APK (armeabi-v7a only)
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk picoclaw_fui_armv7.apk
          ls -lh picoclaw_fui_armv7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw_fui_armv7
          path: picoclaw_fui_armv7.apk
